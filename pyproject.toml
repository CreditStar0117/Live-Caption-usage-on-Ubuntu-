[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "caption-english"
version = "1.0.0"
description = "Live English captions for Ubuntu with a resizable overlay"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "faster-whisper>=1.1.0",
  "numpy>=1.24",
  "sounddevice>=0.4.6",
  "pulsectl>=24.4.0",
]

[project.scripts]
caption-english = "caption_english.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
caption_english = ["py.typed"]
